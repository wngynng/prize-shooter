<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>夜市神枪手 · Prize Shooter</title>
<style>
/* ============ 《夜市神枪手》 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #0d1120;
  color: #e8e6f0;
  overflow: hidden;
}
#app { height: 100vh; display: flex; flex-direction: column; }

.screen { display: none; flex: 1; overflow: auto; }
.screen.active { display: flex; flex-direction: column; }

/* ---------- 通用控件 ---------- */
.btn {
  border: none; border-radius: 10px; cursor: pointer;
  padding: 10px 18px; font-size: 15px; font-family: inherit;
  background: #2a3350; color: #e8e6f0;
  transition: transform .08s, filter .15s;
}
.btn:hover { filter: brightness(1.2); }
.btn:active { transform: scale(.96); }
.btn-gold { background: linear-gradient(135deg, #f5b942, #e08a1e); color: #241503; font-weight: bold; }
.btn-ghost { background: #232b45; }
.btn-danger { color: #ff8a8a; }
.btn-small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- 大厅 ---------- */
.hub-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 28px 6px;
}
.hub-title h1 {
  font-size: 30px; letter-spacing: 4px;
  background: linear-gradient(90deg, #ffd873, #ff9d5c, #ff6f91);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hub-title p { color: #8b93ad; font-size: 13px; margin-top: 2px; }
.hub-wallet { display: flex; gap: 10px; }
.gold-pill, .free-pill {
  padding: 8px 16px; border-radius: 999px; font-weight: bold;
  background: #1b2340; border: 1px solid #33406b;
}
.gold-pill { color: #ffd873; }
.free-pill { color: #7ee0a3; font-weight: normal; font-size: 13px; }
.free-pill.used { color: #6b7392; text-decoration: line-through; }

.level-cards { padding: 14px 28px; display: flex; flex-direction: column; gap: 14px; }
.level-card {
  background: linear-gradient(180deg, #1c2440, #161c33);
  border: 1px solid #2c3760; border-radius: 16px;
  padding: 16px 20px; display: flex; gap: 18px; align-items: center;
}
.level-card.locked { opacity: .55; }
.level-card .lv-badge {
  width: 74px; height: 74px; flex-shrink: 0; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 26px; font-weight: bold; color: #fff;
}
.lv-badge .stars { font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,.85); }
.b1 { background: linear-gradient(135deg, #2f7d5b, #1d5a40); }
.b2 { background: linear-gradient(135deg, #2a6bd8, #1c47a0); }
.b3 { background: linear-gradient(135deg, #b0483f, #7d2a24); }

.lv-info { flex: 1; min-width: 0; }
.lv-info h3 { font-size: 18px; }
.lv-info .lv-sub { color: #8b93ad; font-size: 13px; margin: 3px 0 8px; }
.lv-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: #10162c; border: 1px solid #2c3760; color: #a8b2cf;
}
.chip.rN { color: #a8bfd4; border-color: #40506e; }
.chip.rR { color: #4da3ff; border-color: #2b5c9e; }
.chip.rSR { color: #c084fc; border-color: #6b4394; }
.chip.rSSR { color: #ffb340; border-color: #8d6123; }
.chip.r0 { color: #4c5468; border-color: #2a3350; }
.lv-best { color: #6ee7a0; font-size: 12px; margin-top: 8px; }
.lv-action { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.lv-entry { color: #ffd873; font-size: 13px; }
.lock-tip { color: #8b93ad; font-size: 13px; max-width: 180px; text-align: right; }

/* ---------- 章节大厅（两级导航：10 张章牌 ⇄ 章内 5 张关卡卡） ---------- */
.chapter-grid {
  padding: 14px 28px; display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;
}
.chapter-card {
  background: linear-gradient(180deg, #1c2440, #161c33);
  border: 1px solid #2c3760; border-radius: 16px;
  padding: 16px 18px; cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.chapter-card:hover { border-color: #4d5f9e; transform: translateY(-2px); }
.chapter-card.locked { opacity: .62; }
.chapter-card.disabled {
  opacity: .6;
  background: repeating-linear-gradient(135deg, #161c33, #161c33 14px, #12172a 14px, #12172a 28px);
}
.chapter-card .ch-top { display: flex; align-items: center; gap: 12px; }
.chapter-card .ch-icon {
  font-size: 28px; width: 52px; height: 52px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: #10162c; border: 1px solid #2c3760; border-radius: 12px;
}
.chapter-card .ch-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chapter-card .ch-name b { font-size: 17px; white-space: nowrap; }
.chapter-card .ch-stars { color: #ffd873; font-size: 12px; letter-spacing: 2px; }
.chapter-card .ch-theme { color: #8b93ad; font-size: 13px; margin: 10px 0 9px; }
.chapter-card .ch-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ch-status { color: #7ee0a3; }
.ch-status.soon { color: #8b93ad; }
.ch-status.lock { color: #a8b2cf; }

.chapter-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: linear-gradient(180deg, #1c2440, #161c33);
  border: 1px solid #2c3760; border-radius: 16px; padding: 12px 18px;
}
.chapter-head .ch-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.chapter-head .ch-title .ch-icon { font-size: 22px; }
.chapter-head .ch-title b { font-size: 18px; }
.chapter-head .ch-theme { color: #8b93ad; font-size: 13px; }

.hub-actions {
  padding: 10px 28px 26px; display: flex; gap: 12px; align-items: center;
  border-top: 1px solid #1b2340; margin-top: auto; flex-wrap: wrap;
}
.hub-tools { margin-left: auto; display: flex; gap: 8px; }

/* ---------- 射击（横屏：顶栏 / 画布 + 双侧按键） ---------- */
#screen-game { align-items: stretch; background: #080b16; }
.game-shell {
  flex: 1; min-height: 0; width: 100%;
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
}
.game-topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.game-topbar #btnExit { margin-left: auto; }
.hud-chip {
  background: rgba(13, 17, 32, .82); border: 1px solid #3a466f;
  padding: 6px 14px; border-radius: 999px; font-size: 15px; font-weight: bold;
}
.hud-wind { color: #9fd0ff; }
.game-wrap {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
/* 画布宿主：吃掉按键列之外的剩余空间，画布在其中等比缩放居中 */
.canvas-host {
  flex: 1 1 auto; min-width: 0; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center;
}
/* 画布舞台：包住画布与覆盖层（hint），随画布尺寸收缩 */
.canvas-stage { position: relative; line-height: 0; }
#gameCanvas {
  display: block; border-radius: 12px; background: #10152b;
  cursor: crosshair; touch-action: none;
}
/* 屏息（时停）计量条：收进顶栏，自适应填充 */
.game-topbar .breath-track { flex: 1 1 110px; max-width: 260px; margin: 0 4px; }
.breath-track {
  height: 10px; border-radius: 999px; background: rgba(255,255,255,.12);
  overflow: hidden; width: 100%; flex-shrink: 0;
}
.breath-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #38d6c0, #7ef0ff); border-radius: 999px; }
/* 调息锁定态（耗尽→回满前）：红色斜纹提示"不可屏息" */
.breath-bar.lock {
  background: repeating-linear-gradient(45deg, #b0503f 0 8px, #7a3428 8px 16px);
}
/* 关卡提示：画布顶部覆盖层（不挡操作；3 行容量保证横屏操作提示完整显示） */
.hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  max-width: 76%; text-align: center; z-index: 5; pointer-events: none;
  font-size: 12px; color: #cdd6ef; line-height: 1.5;
  background: rgba(13,17,32,.78); border-radius: 8px; padding: 4px 10px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
/* 双侧按键组（画布两侧独立列，不遮挡画面）：
   左 🫁屏息(点按时停) + 🔫开火；右 🔭开镜 + 🔫副开火。竖排贴底 = 拇指活动区 */
.side-ctrl {
  flex: 0 0 auto; align-self: flex-end; padding-bottom: 6px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.side-ctrl.left { }
.side-ctrl.right { }
.side-ctrl button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 50%; padding: 0; line-height: 1;
  color: #fff; cursor: pointer; touch-action: none;
  user-select: none; -webkit-user-select: none;
  border: 3px solid rgba(255, 255, 255, .3);
  box-shadow: 0 8px 20px rgba(0, 0, 0, .5), inset 0 0 12px rgba(0, 0, 0, .25);
  transition: transform .08s, filter .15s, box-shadow .15s;
}
.side-ctrl button span {
  display: block; font-size: 11px; font-weight: bold; margin-top: 3px;
  font-family: inherit; color: rgba(255, 255, 255, .92);
}
.side-ctrl button:active { transform: scale(.9); filter: brightness(1.25); }
/* 左：屏息/时停（点按切换，激活=时停中亮环）——青绿系 */
#btnBreath {
  width: 62px; height: 62px; font-size: 24px;
  background: radial-gradient(circle at 35% 32%, #4ee0c8, #1d7d6e 72%);
}
#btnBreath.on {
  border-color: #7ef0ff;
  box-shadow: 0 0 18px rgba(78, 224, 200, .55), 0 8px 20px rgba(0, 0, 0, .5);
  filter: brightness(1.2);
}
/* 开火（主/副同款同尺寸）——赤红系 */
#btnFire, #btnFire2 {
  width: 78px; height: 78px; font-size: 32px;
  background: radial-gradient(circle at 35% 32%, #ff8a6c, #b0483f 72%);
}
/* 右：开镜（点按切换）——蓝紫系；开镜中亮环高亮 */
#btnScope {
  width: 62px; height: 62px; font-size: 24px;
  background: radial-gradient(circle at 35% 32%, #6ea8ff, #31408f 72%);
}
#btnScope.on {
  border-color: #9fd0ff;
  box-shadow: 0 0 18px rgba(110, 168, 255, .65), 0 8px 20px rgba(0, 0, 0, .5);
  filter: brightness(1.2);
}

/* ---------- 展馆 ---------- */
.g-header { display: flex; align-items: center; gap: 16px; padding: 18px 28px 8px; flex-wrap: wrap; }
.g-header h2 { font-size: 22px; }
.g-stats { margin-left: auto; color: #ffd873; font-size: 14px; display: flex; gap: 16px; }
.g-tip { color: #8b93ad; font-size: 13px; padding: 0 28px 12px; }
.g-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; padding: 0 28px;
}
.g-item { background: #161c33; border: 1px solid #2c3760; border-radius: 14px; padding: 12px; text-align: center; }
.g-item.unknown { opacity: .45; }
.g-item .gi-emoji { font-size: 44px; line-height: 1.3; }
.g-item.unknown .gi-emoji { filter: grayscale(1) brightness(.5); }
.g-item .gi-name { font-size: 14px; margin: 4px 0; }
.g-item .gi-sub { font-size: 12px; color: #8b93ad; margin-bottom: 8px; }
.g-item .gi-sub .pinned { color: #6ee7a0; }
.g-item .btn { width: 100%; font-size: 13px; padding: 7px 6px; }
.g-footer { padding: 18px 28px 26px; display: flex; gap: 12px; }
.r-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; display: inline-block; }

/* ---------- 弹窗 / Toast ---------- */
#modal-root {
  position: fixed; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: rgba(5, 8, 18, .72); z-index: 50; backdrop-filter: blur(3px);
}
#modal-root.open { display: flex; }
.modal {
  background: #1a2140; border: 1px solid #33406b; border-radius: 18px;
  width: min(calc(var(--evw, 100vw) * 0.94), 560px);
  max-height: calc(var(--evh, 100vh) * 0.88); overflow: auto;
  padding: 22px 26px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
}
.modal h3 { font-size: 20px; margin-bottom: 12px; }
.modal .m-body { color: #c9d2ec; font-size: 14px; line-height: 1.8; }
.modal .m-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
.result-grid { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.result-stat { flex: 1; min-width: 100px; background: #10162c; border-radius: 10px; padding: 10px; text-align: center; }
.result-stat b { display: block; font-size: 20px; color: #fff; }
.result-stat span { font-size: 12px; color: #8b93ad; }
.prize-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.prize-chip {
  background: #10162c; border: 1px solid #2c3760; border-radius: 10px;
  padding: 6px 10px; font-size: 14px;
}
.net { font-size: 16px; font-weight: bold; }
.net.pos { color: #6ee7a0; } .net.neg { color: #ff8a8a; }
#toasts { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: rgba(20, 26, 48, .95); border: 1px solid #3a466f; color: #ffd873;
  padding: 10px 20px; border-radius: 999px; font-size: 14px;
  animation: toastIn .25s ease, toastOut .3s ease 1.8s forwards;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

/* ==================== 移动端适配（横屏版） ==================== */
* { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
#app { height: var(--evh, 100vh); height: var(--evh, 100dvh); display: flex; flex-direction: column; }

/* 横屏游戏：触屏竖屏窗口时，整个应用旋转铺满（内容转正需转动手机）
   portrait-rot / --evw / --evh 由 JS 同步（main.js syncOrientation）
   推导：app 原点(top-left) 置于 (0, 100vh)，rotate(-90deg) 后恰好覆盖视口 */
body.touch-ui.portrait-rot #app {
  position: fixed;
  top: 100vh; left: 0;
  width: var(--evw, 100vw); height: var(--evh, 100vh);
  transform-origin: top left;
  transform: rotate(-90deg);
  overflow: hidden;
}

/* 转向提示（非阻断，仅触屏设备竖屏显示；随 app 旋转居中，引导转成横屏） */
.rotate-hint { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
  .rotate-hint {
    display: block;
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 40;
    background: rgba(20, 26, 48, .92); border: 1px solid #3a466f;
    color: #ffd873; font-size: 15px; padding: 12px 22px; border-radius: 999px;
  }
}

/* 触屏设备：状态栏/按钮加大（44px+ 触控标准） */
@media (pointer: coarse) {
  .hud-chip { font-size: 16px; padding: 8px 16px; }
  .game-topbar .btn-small { padding: 10px 14px; font-size: 15px; }
}

/* 窄屏（含旋转态）：大厅/展馆卡片纵向堆叠
   eff-w-narrow 由 JS 按"等效视口宽度"切换（横屏旋转态下 = 物理高度） */
body.eff-w-narrow .hub-header { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px 4px; }
body.eff-w-narrow .hub-wallet { justify-content: space-between; }
body.eff-w-narrow .level-cards { padding: 10px 16px; }
body.eff-w-narrow .chapter-grid { padding: 10px 16px; gap: 10px; }
body.eff-w-narrow .chapter-card { padding: 12px 14px; }
body.eff-w-narrow .chapter-card .ch-icon { width: 44px; height: 44px; font-size: 24px; }
body.eff-w-narrow .chapter-card .ch-name b { font-size: 15px; }
body.eff-w-narrow .chapter-card .ch-theme { margin: 8px 0 7px; font-size: 12px; }
body.eff-w-narrow .chapter-head { padding: 10px 14px; gap: 10px; }
body.eff-w-narrow .level-card { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; }
body.eff-w-narrow .level-card .lv-badge {
  width: 100%; height: 48px; flex-direction: row; gap: 10px;
  border-radius: 10px; font-size: 18px;
}
body.eff-w-narrow .lv-action { flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
body.eff-w-narrow .lv-action .btn { flex: 1; }
body.eff-w-narrow .lock-tip { max-width: none; text-align: left; }
body.eff-w-narrow .hub-actions { padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); }
body.eff-w-narrow .hub-tools { margin-left: 0; }
body.eff-w-narrow .g-header { padding: 14px 16px 6px; }
body.eff-w-narrow .g-tip { padding: 0 16px 10px; }
body.eff-w-narrow .g-grid { padding: 0 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
body.eff-w-narrow .g-footer { padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
/* 窄屏（旋转态）双侧按键微缩 + 收紧列间距，把画布让到最大 */
body.eff-w-narrow #btnFire, body.eff-w-narrow #btnFire2 { width: 64px; height: 64px; font-size: 26px; }
body.eff-w-narrow #btnBreath, body.eff-w-narrow #btnScope { width: 50px; height: 50px; font-size: 20px; }
body.eff-w-narrow .side-ctrl { gap: 8px; padding-bottom: 4px; }
body.eff-w-narrow .game-wrap { gap: 6px; }
body.eff-w-narrow .hint { max-width: 82%; }

</style>
</head>
<body>
<div id="app">

  <!-- ============ 大厅 ============ -->
  <section id="screen-hub" class="screen active">
    <header class="hub-header">
      <div class="hub-title">
        <h1>夜市神枪手</h1>
        <p>打中什么，拿什么。</p>
      </div>
      <div class="hub-wallet">
        <span class="gold-pill" id="hubGold">🪙 300</span>
        <span class="free-pill" id="hubFree">🎫 今日免费 ×1</span>
      </div>
    </header>

    <div class="level-cards" id="levelCards"></div>

    <div class="hub-actions">
      <button class="btn btn-gold" id="btnGallery">🏆 展馆 / 图鉴</button>
      <div id="reliefWrap"></div>
      <div class="hub-tools">
        <button class="btn btn-ghost" id="btnHelp">❓ 玩法</button>
        <button class="btn btn-ghost" id="btnFullscreen">⛶ 全屏</button>
        <button class="btn btn-ghost" id="btnMute">🔊</button>
        <button class="btn btn-ghost btn-danger" id="btnReset">重置</button>
      </div>
    </div>
  </section>

  <!-- ============ 射击（横屏：顶栏 / 画布 + 双侧按键） ============ -->
  <section id="screen-game" class="screen">
    <div class="game-shell">
      <div class="game-topbar">
        <span id="hudBullets" class="hud-chip">🎫 ×10</span>
        <span id="hudHits" class="hud-chip">🎯 0/10</span>
        <span id="hudWind" class="hud-chip hud-wind">🍃 无风</span>
        <div class="breath-track" title="屏息（时停）计量：耗尽后调息 5s">
          <div class="breath-bar" id="breathBar"></div>
        </div>
        <button class="btn btn-ghost btn-small" id="btnExit">退出</button>
      </div>
      <div class="game-wrap">
        <!-- 左侧（画布外）：屏息（时停）+ 开火 -->
        <div class="side-ctrl left">
          <button id="btnBreath" aria-label="屏息/时停（点按切换）">🫁<span>屏息</span></button>
          <button id="btnFire" aria-label="开火（长按连发）">🔫<span>开火</span></button>
        </div>
        <div class="canvas-host">
          <div class="canvas-stage">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div class="hint" id="hudHint"></div>
            <div class="rotate-hint">🔄 转动手机到横屏</div>

/* ------------------------------------------------------------
 * 关卡生成器（纯函数）：十章模板 → 50 条 LEVELS
 * 展开后的字段结构与单关时代完全一致（id = 全局关序 0~49），
 * 附加 chapter（章 id）/ chapterIndex（章内 0~4）便于 UI 与逻辑定位。
 * ------------------------------------------------------------ */
function buildLevels(chapters) {
  const out = [];
  for (const ch of chapters) {
    ch.levels.forEach((lv, i) => {
      out.push(Object.assign({
        id: out.length,
        chapter: ch.id,
        chapterIndex: i,
        stars: lv.stars || ch.stars,
      }, lv));
    });
  }
  return out;
}

const LEVELS = buildLevels(CHAPTERS);

'use strict';
/* ============================================================
 * 射击场景引擎（Canvas）—— 功能模块 M1 / M9（横屏）
 * 瞄准(漂移) / 屏息=时停 / 开镜 / 弹道(风偏+下坠+散布) / 命中判定 / 表现动画
 * 公平性根基：弹着点 = 准星 + 可见风偏 + 可学习下坠 + 微散布
 * ============================================================ */

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

class ShootingScene {
  constructor(canvas, level, hooks) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    // 高分屏适配：物理分辨率渲染，逻辑坐标恒为 960×540（横屏）
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = 960 * this.dpr;
    canvas.height = 540 * this.dpr;
    this.level = level;
    this.hooks = hooks || {};
    this.W = 960;
    this.H = 540;
    this.destroyed = false;

    // 输入状态
    this.aim = { x: this.W / 2, y: this.H * 0.30 };
    this.pointerType = 'mouse';
    this._aimPointerId = null;   // 触屏时追踪"瞄准手指"
    this._lastClient = null;
    this.breathMeter = 1;         // 0~1
    this.breathing = false;       // 屏息=时停（点按切换；耗尽自动退出）
    this._breathLock = false;     // 调息锁：耗尽后须回满才能再屏息
    this.zoomed = false;          // 开镜（倍率见 CONFIG.SHOOTING.SCOPE.ZOOM）
    this.rt = 0;                  // 真实时钟（结束判定/欣赏动画；与世界慢镜解耦）

    // 局内状态
    this.t = 0;
    this.bulletsLeft = level.bullets;
    this.shots = 0;
    this.hits = 0;
    this.prizesWon = [];
    this.cleared = false;
    this.ended = false;
    this._endScheduled = false;
    this.endAt = 0;
    this.lastShotAt = 0;

    // 风
    if (level.wind.mode === 'none') this.wind = { dir: 0, level: 0 };
    else this.wind = this._rollWind(level.wind.level);

    // 场景对象
    this.prizes = [];
    this.tracers = [];
    this.holes = [];
    this.particles = [];
    this.floats = [];
    this.stars = this._makeStars();
    // 传送带（单带横穿底部 / 对开双带 384+442 反向）与转盘（环形靶）：
    // 带速与角速度由关卡参数化（铁轨夜市章），方向每局随机定正反
    const M = level.moving || {};
    this.beltDir = Math.random() < 0.5 ? -1 : 1;
    this.belts = [];
    if (M.conveyor) {
      const speed = M.conveyorSpeed || 55;
      if (M.conveyorLanes === 2) {
        this.belts.push({ y: 384, dir: -this.beltDir, speed, offset: 0 });
        this.belts.push({ y: 442, dir: this.beltDir, speed, offset: 0 });
      } else {
        this.belts.push({ y: 442, dir: this.beltDir, speed, offset: 0 });
      }
    }
    // 转盘：环形轨道（圆心/半径固定，角速度参数化，转向每局随机）
    this.ring = (M.ring || 0) > 0
      ? { cx: 480, cy: 318, r: 92, w: (M.ringSpeed || 0.55) * (Math.random() < 0.5 ? -1 : 1) }
      : null;
    // 架板行让位：有转盘只留顶行；对开双带留顶上两行
    this.shelfRows = this.ring ? [210] : (M.conveyorLanes === 2 ? [210, 288] : [210, 292, 374]);
    this.shake = 0;
    this.muzzle = 0;
    this._raf = 0;
    this._lastTs = 0;

    this._spawnPrizes();
  }

  /* ---------------- 生命周期 ---------------- */

  start() {
    this._onMove = (e) => {
      if (e.pointerType === 'touch') {
        // 触屏：全屏滑动瞄准（相对拖动，准星只随手势位移移动，不跟手指落点，
        // 无需先点到准星上；单指滑到画布任意处均生效）
        if (this._aimPointerId === e.pointerId && this._lastClient) {
          this._applyDragDelta(
            e.clientX - this._lastClient.x,
            e.clientY - this._lastClient.y,
            1,
          );
          this._lastClient = { x: e.clientX, y: e.clientY };
        }
      } else {
        this._updateAim(e);
      }
    };
    this._onDown = (e) => {
      SFX.unlock();
      this.pointerType = e.pointerType || 'mouse';
      if (this.pointerType === 'touch') {
        // 只登记瞄准手指，不移动准星（避免跳跃/遮挡）；
        // 多指防劫持：已有瞄准手指时忽略后落手指（拇指去按开火/开镜
        // 时擦过画布不会夺走瞄准控制权）
        e.preventDefault();   // 抑制触屏默认行为（拖选/聚焦等兜底）
        if (this._aimPointerId === null) {
          this._aimPointerId = e.pointerId;
          this._lastClient = { x: e.clientX, y: e.clientY };
        }
      } else {
        this._updateAim(e);
        if (e.button === 0) this.shoot();
      }
    };
    // 触屏开火改由 HUD 的 🔫 按钮负责，抬手不再走火
    this._onUp = (e) => {
      if (e.pointerType === 'touch' && this._aimPointerId === e.pointerId) {
        this._aimPointerId = null;
        this._lastClient = null;
      }
    };
    this._onCancel = (e) => this._onUp(e);
    this._onCtx = (e) => e.preventDefault();
    this._onKeyDown = (e) => {
      if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) this.toggleBreath(); }
    };
    this._onKeyUp = (e) => { /* 屏息为点按切换，抬键无操作 */ };

    this.canvas.addEventListener('pointermove', this._onMove);
    this.canvas.addEventListener('pointerdown', this._onDown);
    this.canvas.addEventListener('contextmenu', this._onCtx);
    window.addEventListener('pointerup', this._onUp);
    window.addEventListener('pointercancel', this._onCancel);
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);

    this._lastTs = performance.now();
    this._raf = requestAnimationFrame((ts) => this._tick(ts));
  }

  stop() {
    this.destroyed = true;
    cancelAnimationFrame(this._raf);
    this.canvas.removeEventListener('pointermove', this._onMove);
    this.canvas.removeEventListener('pointerdown', this._onDown);
    this.canvas.removeEventListener('contextmenu', this._onCtx);
    window.removeEventListener('pointerup', this._onUp);
    window.removeEventListener('pointercancel', this._onCancel);
    window.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('keyup', this._onKeyUp);
  }

  /* 玩家中途退出：保留已赢奖品，无清台奖励（不退票） */
  endEarly() {
    if (this.ended) return;
    this.ended = true;
    if (this.hooks.onEnd) this.hooks.onEnd(this.getResult());
  }

  getResult() {
    return {
      shots: this.shots,
      hits: this.hits,
      prizes: this.prizesWon.slice(),
      cleared: this.cleared,
      bulletsLeft: this.bulletsLeft,
      early: this.ended && !this._endScheduled,
    };
  }

  /* ---------------- 奖品布场 ---------------- */

  _rollWind(maxLevel) {
    return { dir: Math.random() < 0.5 ? -1 : 1, level: 1 + ((Math.random() * maxLevel) | 0) };
  }

  _makeStars() {
    const s = [];
    for (let i = 0; i < 70; i++) {
      s.push({
        x: Math.random() * this.W, y: Math.random() * 160,
        r: Math.random() < 0.3 ? 2 : 1,
        tw: 1 + Math.random() * 2, phase: Math.random() * 6.28,
      });
    }
    return s;
  }

  _spawnPrizes() {
    const L = this.level;
    // 1) 按稀有度从图鉴抽（尽量不重复，图鉴不够允许重复）
    const bag = [];
    for (const r of ['N', 'R', 'SR', 'SSR']) {
      const n = L.pool[r] || 0;
      if (!n) continue;
      const cands = shuffle(CATALOG.filter(c => c.rarity === r).slice());
      for (let i = 0; i < n; i++) bag.push(cands[i % cands.length]);
    }
    shuffle(bag);

    // 2) 吊摆位（挂雨棚下，横屏顶部横向铺开）
    const swingN = L.moving.swing || 0;
    for (let i = 0; i < swingN && bag.length; i++) {
      const cat = bag.pop();
      const ax = lerp(150, 810, swingN === 1 ? 0.5 : i / (swingN - 1));
      this.prizes.push({
        cat, kind: 'swing',
        anchorX: ax, anchorY: 62,
        len: 46 + Math.random() * 12,
        amp: 0.5 + Math.random() * 0.12,   // 摆角幅度(rad)
        T: 2.2 + Math.random() * 0.8,      // 周期(s)
        phase: Math.random() * Math.PI * 2,
        x: ax, y: 140,
      });
    }

    // 3) 传送带位（单带横穿底部；对开双带 = 上 384 / 下 442 两条反向带，交替分配）
    const convN = L.moving.conveyor || 0;
    for (let i = 0; i < convN && bag.length; i++) {
      const cat = bag.pop();
      const belt = this.belts[this.belts.length > 1 ? (i % 2) : 0];
      this.prizes.push({
        cat, kind: 'conveyor',
        x: 140 + Math.random() * 680,
        vx: belt.dir * belt.speed * (0.9 + Math.random() * 0.2),
        x0: 70, x1: 870, beltY: belt.y,
      });
    }

    // 3.5) 转盘位（环形轨道均布公转——切向运动，预判提前量按转向算）
    const ringN = L.moving.ring || 0;
    for (let i = 0; i < ringN && bag.length; i++) {
      const cat = bag.pop();
      this.prizes.push({
        cat, kind: 'ring',
        angle0: (i / ringN) * Math.PI * 2,
      });
    }

    // 4) 其余上架板（行数随布局让位：转盘让出中下层、双带让出最下层）
    const rows = this.shelfRows;
    const counts = rows.map(() => 0);
    bag.forEach((_, i) => { counts[i % rows.length]++; });
    let idx = 0;
    rows.forEach((rowY, ri) => {
      const n = counts[ri];
      for (let i = 0; i < n; i++, idx++) {
        const cat = bag[idx];
        const x = n === 1 ? 480 : lerp(140, 820, i / (n - 1)) + (Math.random() * 24 - 12);
        this.prizes.push({ cat, kind: 'shelf', x, y: rowY, rowY });
      }
    });

    // 公共字段
    for (const p of this.prizes) {
      p.hitR = CONFIG.RARITY[p.cat.rarity].hitR;
      p.state = 'idle';
      if (p.kind === 'shelf') p.y = p.rowY - p.hitR * 0.8 - 2;
      if (p.kind === 'conveyor') p.y = p.beltY - p.hitR * 0.75;
      if (p.kind === 'ring' && this.ring) {
        const a = p.angle0 + this.ring.w * this.t;
        p.x = this.ring.cx + Math.cos(a) * this.ring.r;
        p.y = this.ring.cy + Math.sin(a) * this.ring.r;
      }
    }
  }

  /* ---------------- 输入 ---------------- */

  /* 竖屏旋转显示态（main.js syncOrientation 切换 body.portrait-rot）
   单一事实来源：读取该类即知画布坐标轴被 CSS 旋转了 -90° */
  _isRotated() {
    return document.body.classList.contains('portrait-rot');
  }

  /* 开镜缩放中心 = 准星本身（不钳制）：十字分划线恒在镜片正中，视野随准星
     平移——贴边瞄准时镜内会露出世界外的夜空（椭圆视野可越出世界范围，
     越出部分只是空区；代价可接受，准星永居中才是硬需求）。 */
  _zoomCenter() { return this._crosshair(); }

  _updateAim(e) {
    const rect = this.canvas.getBoundingClientRect();
    let wx, wy;
    if (this._isRotated()) {
      // 旋转态：局部 +x 沿屏幕向上、局部 +y 沿屏幕向右（触屏笔记本等混合场景）
      wx = (rect.bottom - e.clientY) * (this.W / Math.max(1, rect.height));
      wy = (e.clientX - rect.left) * (this.H / Math.max(1, rect.width));
    } else {
      wx = (e.clientX - rect.left) * (this.W / Math.max(1, rect.width));
      wy = (e.clientY - rect.top) * (this.H / Math.max(1, rect.height));
    }
    // 开镜逆映射：屏幕点 → 世界点（围绕缩放中心除以倍率）
    if (this.zoomed && !this.ended) {
      const z = CONFIG.SHOOTING.SCOPE.ZOOM;
      const c = this._zoomCenter();
      wx = c.x + (wx - c.x) / z;
      wy = c.y + (wy - c.y) / z;
    }
    this.aim.x = clamp(wx, 0, this.W);
    this.aim.y = clamp(wy, 0, this.H);
  }

  /* 相对拖动增量（公共入口：画布触屏拖动共用）
   * dvx/dvy = 手指在屏幕坐标系下的位移（px）；gain = 灵敏度倍率（画布拖动=1）
   * 含竖屏旋转态的方向逆映射：#app 被 CSS rotate(-90deg) 时画布局部 +x 沿屏幕
   * 向上、局部 +y 沿屏幕向右 → 手指增量逆映射为 (-dvy, dvx)；
   * 旋转后包围盒宽高互换，故 x 缩放用 rect.height、y 用 rect.width。
   * 开镜时灵敏度随倍率降低（准星移动量 ÷ ZOOM，利于精瞄） */
  _applyDragDelta(dvx, dvy, gain) {
    const rect = this.canvas.getBoundingClientRect();
    let dx, dy;
    if (this._isRotated()) {
      dx = -dvy * (this.W / Math.max(1, rect.height));
      dy = dvx * (this.H / Math.max(1, rect.width));
    } else {
      dx = dvx * (this.W / Math.max(1, rect.width));
      dy = dvy * (this.H / Math.max(1, rect.height));
    }
    const z = (this.zoomed && !this.ended) ? CONFIG.SHOOTING.SCOPE.ZOOM : 1;
    this.aim.x = clamp(this.aim.x + dx * gain / z, 0, this.W);
    this.aim.y = clamp(this.aim.y + dy * gain / z, 0, this.H);
  }

  /* 屏息 = 点按切换的时停模式：
     点按进入（耐力条开始消耗）→ 再点提前退出；耗尽自动退出并上调息锁（5s 回满解锁）。
     锁定期点按无效——防"空条反复开关"。 */
  toggleBreath() {
    if (this.ended) return;
    if (this.breathing) { this.breathing = false; return; }   // 手动提前退出（不锁）
    if (this._breathLock || this.breathMeter <= 0) return;    // 调息中：不可进入
    this.breathing = true;
  }
  toggleScope() {
    this.zoomed = !this.zoomed;
    return this.zoomed;
  }

  _crosshair() {
    const A = this.level.sway * (this.breathing ? CONFIG.SHOOTING.BREATH.SWAY_FACTOR : 1);
    return {
      x: this.aim.x + A * Math.sin(this.t * 1.7),
      y: this.aim.y + A * Math.sin(this.t * 2.3 + 1.2),
    };
  }

  _windOffset() {
    if (!this.wind.level) return 0;
    return this.wind.dir * this.wind.level * CONFIG.SHOOTING.WIND_PX_PER_LEVEL
      * (0.85 + Math.random() * 0.3);
  }

  /* ---------------- 射击 ---------------- */

  shoot() {
    if (this.ended || this._endScheduled) return;
    const now = performance.now();
    if (now - this.lastShotAt < CONFIG.SHOOTING.SHOT_COOLDOWN_MS) return;
    if (this.bulletsLeft <= 0) return;
    this.lastShotAt = now;
    this.bulletsLeft--;
    this.shots++;

    const c = this._crosshair();
    const ix = c.x + this._windOffset() + (Math.random() * 2 - 1) * CONFIG.SHOOTING.SPREAD;
    const iy = c.y + this.level.drop + (Math.random() * 2 - 1) * CONFIG.SHOOTING.SPREAD;

    this.tracers.push({
      from: { x: this.W / 2, y: this.H - 12 },
      to: { x: ix, y: iy },
      t: 0, dur: CONFIG.SHOOTING.TRACER_MS / 1000,
    });
    this.shake = 2.5;
    this.muzzle = 1;
    SFX.shoot();

    // perShot 模式：为下一枪重摇风力
    if (this.level.wind.mode === 'perShot') this.wind = this._rollWind(this.level.wind.level);
  }

  _resolveImpact(tr) {
    const { x, y } = tr.to;
    this.holes.push({ x, y });
    if (this.holes.length > 40) this.holes.shift();

    let best = null, bd = Infinity;
    for (const p of this.prizes) {
      if (p.state !== 'idle') continue;
      const d = Math.hypot(x - p.x, y - p.y);
      if (d <= p.hitR && d < bd) { best = p; bd = d; }
    }
    if (best) this._hitPrize(best);
    else {
      for (let i = 0; i < 6; i++) {   // 落空尘土反馈
        const a = Math.random() * Math.PI * 2;
        this.particles.push({
          x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 40,
          life: 0.3 + Math.random() * 0.2, color: '#8b93a7', r: 2,
        });
      }
    }
  }

  _hitPrize(p) {
    p.state = 'falling';
    p.fall = { vx: (Math.random() - 0.5) * 90, vy: -260, rot: 0, vr: (Math.random() - 0.5) * 7 };
    this.hits++;
    this.prizesWon.push(p.cat);
    const rc = CONFIG.RARITY[p.cat.rarity];
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 180;
      this.particles.push({
        x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        life: 0.4 + Math.random() * 0.3, color: rc.color, r: 2 + Math.random() * 2.5,
      });
    }
    this.floats.push({ x: p.x, y: p.y - 30, text: `${p.cat.emoji} +1`, life: 0.9, color: rc.color });
    SFX.hit();
    if (this.hooks.onPrizeHit) this.hooks.onPrizeHit(p.cat);
  }

  /* ---------------- 帧循环 ---------------- */

  _tick(ts) {
    if (this.destroyed) return;
    const dt = Math.min((ts - this._lastTs) / 1000, 0.05);
    this._lastTs = ts;
    this.update(dt);
    this.render();
    this._raf = requestAnimationFrame((t) => this._tick(t));
  }

  update(dt) {
    // 屏息 = 时停（M9）：点按进入（breathing 状态），耐力条按真实时间消耗；
    // 耗尽自动退出并上调息锁——空条回满 RECHARGE 秒内不能再屏息
    // （提前再点退出不受锁，可立即续用余量）。
    const B = CONFIG.SHOOTING.BREATH;
    if (this.breathing) {
      this.breathMeter = Math.max(0, this.breathMeter - dt / B.DURATION);
      if (this.breathMeter <= 0) {
        this.breathing = false;         // 耗尽 → 自动退出时停
        this._breathLock = true;        // → 进入调息
      }
    } else {
      this.breathMeter = Math.min(1, this.breathMeter + dt / B.RECHARGE);
      if (this._breathLock && this.breathMeter >= 1) this._breathLock = false;  // 回满解除
    }
    // 世界时间步长：屏息期间世界极慢（SCALE=0.05 的"时停"感）——吊摆/传送带/
    // 坠落/粒子近乎冻结；但子弹曳光与命中结算走真实 dt（开枪不受慢镜影响，
    // 命中即时反馈），浮字（+分反馈）同样走真实时间。
    const wdt = this.breathing ? dt * B.SCALE : dt;
    this.t += wdt;
    this.rt += dt;               // 真实时钟：结束判定/欣赏动画计时（慢镜不拖结算）

    // 奖品运动（吊摆相位由 this.t 驱动，t 冻结即自动冻结）
    for (const p of this.prizes) {
      if (p.state === 'idle') {
        if (p.kind === 'swing') {
          const th = p.amp * Math.sin((this.t / p.T) * Math.PI * 2 + p.phase);
          p.x = p.anchorX + p.len * Math.sin(th);
          p.y = p.anchorY + p.len * Math.cos(th);
        } else if (p.kind === 'conveyor') {
          p.x += p.vx * wdt;
          if (p.x > p.x1) p.x = p.x0;
          else if (p.x < p.x0) p.x = p.x1;
        } else if (p.kind === 'ring' && this.ring) {
          // 转盘公转：θ = 初相 + ω·t（t 走世界时间，慢镜自动冻结转盘）
          const a = p.angle0 + this.ring.w * this.t;
          p.x = this.ring.cx + Math.cos(a) * this.ring.r;
          p.y = this.ring.cy + Math.sin(a) * this.ring.r;
        }
      } else if (p.state === 'falling') {
        p.fall.vy += 1500 * wdt;
        p.x += p.fall.vx * wdt;
        p.y += p.fall.vy * wdt;
        p.fall.rot += p.fall.vr * wdt;
        if (p.y > this.H + 90) p.state = 'gone';
      }
    }
    for (const b of this.belts) {
      b.offset = ((b.offset + b.speed * wdt * b.dir) % 40 + 40) % 40;
    }

    // 子弹飞行（真实时间：慢镜中子弹照常全速飞行、即时命中）
    for (let i = this.tracers.length - 1; i >= 0; i--) {
      const tr = this.tracers[i];
      tr.t += dt;
      if (tr.t >= tr.dur) { this.tracers.splice(i, 1); this._resolveImpact(tr); }
    }

    // 粒子随世界慢镜漂浮（命中的碎屑缓降 = 慢镜质感）；浮字走真实时间（反馈可读）
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.life -= wdt;
      pt.x += pt.vx * wdt; pt.y += pt.vy * wdt; pt.vy += 500 * wdt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.life -= dt; f.y -= 45 * dt;
      if (f.life <= 0) this.floats.splice(i, 1);
    }

    this.shake = Math.max(0, this.shake - 14 * dt);
    this.muzzle = Math.max(0, this.muzzle - 6 * dt);

    // 结束判定：弹尽 或 清台（留 1s 欣赏动画；按真实时钟计——屏息慢镜不拖结算）
    const anyIdle = this.prizes.some(p => p.state === 'idle');
    if (!this._endScheduled && this.tracers.length === 0
        && (this.bulletsLeft <= 0 || !anyIdle)) {
      this.cleared = !anyIdle;
      this._endScheduled = true;
      this.endAt = this.rt + 1.0;
    }
    if (this._endScheduled && !this.ended && this.rt >= this.endAt) {
      this.ended = true;
      if (this.hooks.onEnd) this.hooks.onEnd(this.getResult());
    }

    if (this.hooks.updateHUD) this.hooks.updateHUD({
      bullets: this.bulletsLeft, total: this.level.bullets,
      hits: this.hits, wind: this.wind, breath: this.breathMeter,
      breathLock: this._breathLock, breathing: this.breathing, zoomed: this.zoomed,
    });
  }

  /* ---------------- 渲染 ---------------- */

  render() {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.save();
    if (this.shake > 0.01) {
      ctx.translate((Math.random() - 0.5) * this.shake * 2, (Math.random() - 0.5) * this.shake * 2);
    }
    // 开镜（M9）：视野中心 = 准星（不钳制），十字分划线恒在镜片正中；
    // 贴边瞄准时镜内露出世界外的夜空（视野可越出世界，越出部分只是空区）
    let z = 1, zc = null;
    if (this.zoomed && !this.ended) {
      z = CONFIG.SHOOTING.SCOPE.ZOOM;
      zc = this._zoomCenter();
      ctx.translate(this.W / 2, this.H / 2);
      ctx.scale(z, z);
      ctx.translate(-zc.x, -zc.y);
    }

    // 夜空（多填充世界外一圈：开镜贴边时镜内不露画布底色，仍是夜空）
    const sky = ctx.createLinearGradient(0, 0, 0, this.H);
    sky.addColorStop(0, '#141b33'); sky.addColorStop(1, '#0c0f1d');
    ctx.fillStyle = sky;
    ctx.fillRect(-this.W, -this.H, this.W * 3, this.H * 3);
    ctx.fillStyle = '#c9d4ff';
    for (const st of this.stars) {
      ctx.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(this.t * st.tw + st.phase));
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    this._drawBooth(ctx);

    // 弹孔（学习风偏/下坠的反馈）
    for (const h of this.holes) {
      ctx.beginPath(); ctx.arc(h.x, h.y, 3.5, 0, 7);
      ctx.fillStyle = '#0a0d16'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
    }

    for (const p of this.prizes) {
      if (p.state !== 'gone') this._drawPrize(ctx, p);
    }

    // 粒子
    for (const pt of this.particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life * 2.2));
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 浮字
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of this.floats) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.4));
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // 曳光弹
    for (const tr of this.tracers) {
      const k = Math.min(1, tr.t / tr.dur);
      const x = tr.from.x + (tr.to.x - tr.from.x) * k;
      const y = tr.from.y + (tr.to.y - tr.from.y) * k;
      ctx.strokeStyle = 'rgba(255, 214, 102, .9)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(tr.from.x, tr.from.y); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
    }

    // 枪口焰
    if (this.muzzle > 0.02) {
      ctx.globalAlpha = this.muzzle;
      ctx.fillStyle = '#ffd873';
      ctx.beginPath();
      ctx.arc(this.W / 2, this.H - 14, 10 + 14 * (1 - this.muzzle), 0, 7);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // —— 屏幕空间叠加层（不随开镜缩放）——
    // 时停冷色滤层：屏息=世界慢镜（×0.05）的可见反馈
    if (this.breathing) {
      ctx.fillStyle = 'rgba(90, 200, 255, .07)';
      ctx.fillRect(0, 0, this.W, this.H);
    }

    // 准星屏幕坐标：开镜时十字分划线恒在镜片正中（视野随准星平移），
    // 未开镜时为普通圆准星的世界坐标
    let sx = null, sy = null;
    if (!this.ended) {
      if (zc) {
        sx = this.W / 2; sy = this.H / 2;
      } else {
        const c = this._crosshair();
        sx = c.x; sy = c.y;
      }
    }

    if (zc && sx !== null) {
      // —— 狙击镜（CS2 式）：椭圆镜片 + 镜外纯黑 + 十字分划线 ——
      const SC = CONFIG.SHOOTING.SCOPE;
      const cx = this.W / 2, cy = this.H / 2;
      const rx = this.W * SC.LENS_X, ry = this.H * SC.LENS_Y;
      const halo = this.breathing ? 'rgba(126, 240, 255, .35)' : 'rgba(255, 255, 255, .30)';
      const line = 'rgba(8, 12, 18, .92)';
      // 镜外遮黑（矩形挖去椭圆，evenodd）+ 镜筒边环
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.rect(0, 0, this.W, this.H);
      ctx.ellipse(cx, cy, rx, ry, 0, 0, 7);
      ctx.fill('evenodd');
      ctx.lineWidth = 7; ctx.strokeStyle = '#000';
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.stroke();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(180, 210, 235, .5)';
      ctx.beginPath(); ctx.ellipse(cx, cy, rx - 4, ry - 4, 0, 0, 7); ctx.stroke();
      // 分划线（裁剪进镜片内）：全幅十字 + 轴向密位刻度 + 中心点。
      // 深色场景下纯黑线不可读 → 先画浅色光晕层再压深色主线
      ctx.save();
      ctx.beginPath(); ctx.ellipse(cx, cy, rx - 3, ry - 3, 0, 0, 7); ctx.clip();
      ctx.strokeStyle = halo; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - rx, sy); ctx.lineTo(cx + rx, sy);
      ctx.moveTo(sx, cy - ry); ctx.lineTo(sx, cy + ry);
      ctx.stroke();
      ctx.strokeStyle = line; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cx - rx, sy); ctx.lineTo(cx + rx, sy);
      ctx.moveTo(sx, cy - ry); ctx.lineTo(sx, cy + ry);
      for (let k = 1; k <= 6; k++) {
        const d = 60 * k;                      // 密位刻度：轴向每 60px 一格
        if (d < rx - 14) {
          ctx.moveTo(cx + d, sy - 5); ctx.lineTo(cx + d, sy + 5);
          ctx.moveTo(cx - d, sy - 5); ctx.lineTo(cx - d, sy + 5);
        }
        if (d < ry - 14) {
          ctx.moveTo(sx - 5, cy + d); ctx.lineTo(sx + 5, cy + d);
          ctx.moveTo(sx - 5, cy - d); ctx.lineTo(sx + 5, cy - d);
        }
      }
      ctx.stroke();
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, 7); ctx.fill();
      ctx.fillStyle = line;
      ctx.beginPath(); ctx.arc(sx, sy, 1.4, 0, 7); ctx.fill();
      ctx.restore();
    } else if (sx !== null) {
      // 普通准星（未开镜，固定屏幕尺寸）
      ctx.strokeStyle = this.breathing ? '#7ef0ff' : '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, 14, 0, 7); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx - 22, sy); ctx.lineTo(sx - 8, sy);
      ctx.moveTo(sx + 8, sy); ctx.lineTo(sx + 22, sy);
      ctx.moveTo(sx, sy - 22); ctx.lineTo(sx, sy - 8);
      ctx.moveTo(sx, sy + 8); ctx.lineTo(sx, sy + 22);
      ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.arc(sx, sy, 1.8, 0, 7); ctx.fill();
    }
  }

  _drawBooth(ctx) {
    const AW = 56;                 // 雨棚高（横屏纵向紧凑）
    const BOT = 478;               // 摊位底（柜台顶）
    // 雨棚（红白条纹 + 波浪边）
    for (let x = -8; x < this.W + 60; x += 60) {
      const col = ((x / 60) | 0) % 2 === 0 ? '#e5484d' : '#f3ead9';
      ctx.fillStyle = col;
      ctx.fillRect(x, 0, 60, AW);
      ctx.beginPath(); ctx.arc(x + 30, AW, 30, 0, Math.PI); ctx.fill();
    }
    // 檐口灯串
    for (let x = 30; x < this.W; x += 68) {
      ctx.fillStyle = '#ffd27a';
      ctx.beginPath(); ctx.arc(x, AW + 12, 3.4, 0, 7); ctx.fill();
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(x, AW + 12, 9, 0, 7); ctx.fill();
      ctx.restore();
    }
    // 立柱（贯穿到柜台，框出摊位正面）
    ctx.fillStyle = '#5b3a21';
    ctx.fillRect(40, AW, 14, BOT - AW);
    ctx.fillRect(this.W - 54, AW, 14, BOT - AW);
    // 背景板
    ctx.fillStyle = '#1e2540';
    ctx.fillRect(54, AW, this.W - 108, BOT - AW);
    const vg = ctx.createRadialGradient(this.W / 2, 270, 130, this.W / 2, 270, 460);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(54, AW, this.W - 108, BOT - AW);

    // 架板（行数随布局：转盘/对开双带关让出相应层）
    for (const y of this.shelfRows) {
      ctx.fillStyle = '#8a5a2e';
      ctx.fillRect(64, y, this.W - 128, 11);
      ctx.fillStyle = '#6d4622';
      ctx.fillRect(64, y + 11, this.W - 128, 4);
    }

    // 传送带（单带横穿底部；对开双带 = 上下两条反向，条纹随带速滚动）
    for (const b of this.belts) {
      const y = b.y, h = 28;
      ctx.fillStyle = '#232840';
      ctx.fillRect(64, y, this.W - 128, h);
      ctx.fillStyle = '#3a4266';
      for (let x = 64 - 40 + b.offset; x < this.W - 64; x += 40) {
        ctx.fillRect(Math.max(64, x), y + 4, 18, h - 8);
      }
      ctx.fillStyle = '#151a2c';
      ctx.fillRect(56, y - 4, 14, h + 8);
      ctx.fillRect(this.W - 70, y - 4, 14, h + 8);
    }

    // 转盘（环形靶轨道：底盘辐条随奖品同转，一眼读出转向）
    if (this.ring) {
      const { cx, cy, r } = this.ring;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(this.ring.w * this.t);
      ctx.strokeStyle = '#3a4266';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(58,66,102,.75)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 16);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.stroke();
      }
      ctx.fillStyle = '#2c3760';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd873';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
      ctx.restore();
    }

    // 底部柜台 + 招牌 + 枪身剪影
    ctx.fillStyle = '#3b2a1a';
    ctx.fillRect(-8, BOT, this.W + 16, this.H - BOT + 8);
    ctx.fillStyle = '#2c1f12';
    for (let x = 0; x < this.W; x += 90) ctx.fillRect(x, BOT, 4, this.H - BOT);
    ctx.fillStyle = '#ffd873';
    ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🎯 打中什么，拿什么', this.W / 2, BOT + 22);
    ctx.fillStyle = '#14161f';
    ctx.beginPath();
    ctx.moveTo(this.W / 2 - 16, this.H);
    ctx.lineTo(this.W / 2 - 7, this.H - 26);
    ctx.lineTo(this.W / 2 + 7, this.H - 26);
    ctx.lineTo(this.W / 2 + 16, this.H);
    ctx.closePath(); ctx.fill();
  }

  _drawPrize(ctx, p) {
    const rc = CONFIG.RARITY[p.cat.rarity];
    ctx.save();
    if (p.state === 'falling') {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.fall.rot);
      ctx.translate(-p.x, -p.y);
    }
    if (p.kind === 'swing' && p.state === 'idle') {
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.anchorX, p.anchorY);
      ctx.lineTo(p.x, p.y - p.hitR * 0.5);
      ctx.stroke();
    }
    // 稀有度虚线圈 = 判定范围（原型调试辅助）
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = rc.color;
    ctx.globalAlpha = p.state === 'idle' ? 0.55 : 0.25;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.hitR, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    // 奖品本体
    const fs = Math.round(p.hitR * 1.75);
    ctx.font = `${fs}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.cat.emoji, p.x, p.y + fs * 0.06);
    ctx.restore();
  }
}

'use strict';
/* ============================================================
 * 《夜市神枪手》主程序
 * 屏幕状态机 + 经济系统(M4) + 展馆背包(M5) + 存档(M6)
 * + UI框架(M7) + 音效(M8) + 新手引导(M10)
 * ============================================================ */

/* ---------------- 音效（WebAudio 合成，M8） ---------------- */
const SFX = (() => {
  let ac = null;
  let muted = false;
  function unlock() {
    if (muted) return;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function blip(f0, f1, dur, type, vol, delay) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  return {
    unlock,
    setMuted(m) { muted = m; },
    shoot() { blip(300, 60, 0.1, 'square', 0.08); },
    hit() { blip(880, 1400, 0.09, 'triangle', 0.16); },
    sell() { blip(660, 990, 0.12, 'triangle', 0.14); },
    fanfare() {
      blip(523, 523, 0.12, 'triangle', 0.14, 0);
      blip(659, 659, 0.12, 'triangle', 0.14, 0.12);
      blip(784, 784, 0.2, 'triangle', 0.16, 0.24);
    },
  };
})();

/* ---------------- 存档（M6 → v2：50 关架构，localStorage 容错） ----------------
 * v2：unlocked 由布尔数组改为关序 int（1~50，= 已解锁到第几关）+ titles 称号
 * v1 旧档只读迁移（迁移后写 v2，v1 原档保留不动，回退旧版本不丢进度） */
const SAVE_KEY = 'prizeShooterSave_v2';
const SAVE_KEY_V1 = 'prizeShooterSave_v1';
const STORE = (() => {
  let mem = null;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
  catch (e) { mem = {}; }   // 无 localStorage 环境用内存兜底
  return {
    get(k) {
      try { return mem ? mem[k] : localStorage.getItem(k); } catch (e) { return null; }
    },
    set(k, v) {
      try { if (mem) mem[k] = v; else localStorage.setItem(k, v); } catch (e) {}
    },
  };
})();

function defaultSave() {
  return {
    gold: CONFIG.ECONOMY.START_GOLD,
    inventory: {},                 // { prizeId: count } 当前持有（全部可售）
    dex: {},                       // { prizeId: true } 图鉴永久展出记录（卖出不消失）
    unlocked: 1,                   // 已解锁到第几关（1 = 仅第 1 关；上限 50）
    bestHits: new Array(LEVELS.length).fill(0),
    bestAcc: new Array(LEVELS.length).fill(0),
    lastFreeDay: '',
    lastReliefDay: '',
    seenHelp: false,
    muted: false,
    titles: [],                    // 通关称号（「夜市神枪手」等，M5 起授予）
  };
}

/* v1 → v2：布尔解锁数组 → 关序 int。
 * 旧档满进度（大师关已解锁，无可解锁关）→ 10（新第一章毕业，直入第二章）；
 * 旧嘉年华已解锁（= 已通旧小摊）→ 2；其余 → 1。金币/图鉴/库存原样继承。 */
function migrateFromV1(v1) {
  const s = defaultSave();
  s.gold = v1.gold != null ? v1.gold : s.gold;
  s.inventory = v1.inventory || {};
  s.dex = v1.dex || {};
  s.lastFreeDay = v1.lastFreeDay || '';
  s.lastReliefDay = v1.lastReliefDay || '';
  s.seenHelp = !!v1.seenHelp;
  s.muted = !!v1.muted;
  const b = v1.bestHits || [], a = v1.bestAcc || [];
  for (let i = 0; i < Math.min(b.length, s.bestHits.length); i++) s.bestHits[i] = b[i] || 0;
  for (let i = 0; i < Math.min(a.length, s.bestAcc.length); i++) s.bestAcc[i] = a[i] || 0;
  const u = v1.unlocked || [];
  if (u[2]) s.unlocked = 10;
  else if (u[1]) s.unlocked = 2;
  else s.unlocked = 1;
  return s;
}

/* 存档规范化：补齐数组长度 / 解锁范围 / 缺失字段（多标签热重载与旧 v2 兜底） */
function normalizeSave(s) {
  const out = Object.assign(defaultSave(), s);
  out.unlocked = clamp(Math.round(out.unlocked) || 1, 1, LEVELS.length);
  while (out.bestHits.length < LEVELS.length) out.bestHits.push(0);
  while (out.bestAcc.length < LEVELS.length) out.bestAcc.push(0);
  out.bestHits.length = LEVELS.length;
  out.bestAcc.length = LEVELS.length;
  if (!out.titles) out.titles = [];
  if (!out.dex) out.dex = {};
  if (!out.inventory) out.inventory = {};
  // 图鉴推导：老存档无 dex 字段时由现有库存补永久展出记录
  for (const id in out.inventory) {
    if (out.inventory[id] > 0) out.dex[id] = true;
  }
  return out;
}

const App = {
  save: null,
  scene: null,
  currentLevel: 0,
  freeUsedThisRun: false,
  hubChapter: null,      // 大厅两级导航：null = 章牌列表，否则章 id（章内关卡视图）

  /* ---------- 启动 ---------- */
  init() {
    let loaded = null;
    const raw = STORE.get(SAVE_KEY);
    try { if (raw) loaded = JSON.parse(raw); } catch (e) { loaded = null; }
    if (loaded) {
      this.save = normalizeSave(loaded);
    } else {
      // v1 旧档迁移：读 v1 → 转 v2（过 normalizeSave 补图鉴推导/字段）→ 立即写 v2
      // （v1 原档保留不动，回退旧版本不丢进度）
      const raw1 = STORE.get(SAVE_KEY_V1);
      let v1 = null;
      try { if (raw1) v1 = JSON.parse(raw1); } catch (e) { v1 = null; }
      this.save = v1 ? normalizeSave(migrateFromV1(v1)) : defaultSave();
      this.persist();
    }
    SFX.setMuted(this.save.muted);

    this._bind();
    this.syncOrientation();
    this.showHub();
    if (!this.save.seenHelp) this.showHelp(true);
  },
  persist() { STORE.set(SAVE_KEY, JSON.stringify(this.save)); },

  /* ---------- 屏幕方向（M16）：横屏游戏 ----------
   横屏版：触屏竖屏窗口时给 body 加 portrait-rot，由 CSS 把 #app 整体
   rotate(-90deg) 铺满屏幕（横屏画面侧向呈现，转动手机即转正）。
   --evw/--evh 是"等效视口"尺寸（旋转态下宽高互换），供原 vw/vh 样式使用；
   eff-w-narrow 用等效宽度替代媒体查询（媒体查询读物理方向，旋转态会判断错）。 */
  syncOrientation() {
    const touch = document.body.classList.contains('touch-ui');
    const landscape = matchMedia('(orientation: landscape)').matches;
    const rot = touch && !landscape;       // 竖屏窗口 → 旋转铺满兜底
    document.body.classList.toggle('portrait-rot', rot);
    const evW = rot ? window.innerHeight : window.innerWidth;
    const evH = rot ? window.innerWidth : window.innerHeight;
    const root = document.documentElement;
    root.style.setProperty('--evw', evW + 'px');
    root.style.setProperty('--evh', evH + 'px');
    document.body.classList.toggle('eff-h-short', evH < 480);
    document.body.classList.toggle('eff-w-narrow', evW < 720);
  },

  /* 画布自适应：在 .canvas-host（按键列之外的剩余空间）内按 16:9 等比放大到恰好填满（不裁切不变形）
   用 offsetWidth/offsetHeight（布局尺寸）：app 被 CSS 旋转时 getBoundingClientRect
   返回的是旋转后 AABB（宽高互换），会把画布算小 */
  _fitCanvas() {
    const host = document.querySelector('.canvas-host');
    const canvas = document.getElementById('gameCanvas');
    if (!host || !canvas) return;
    const w = host.offsetWidth, h = host.offsetHeight;
    if (w < 2 || h < 2) return;
    const s = Math.min(w / 960, h / 540);
    canvas.style.width = Math.round(960 * s) + 'px';
    canvas.style.height = Math.round(540 * s) + 'px';
  },

  today() { return new Date().toDateString(); },
  freeLeft() { return this.save.lastFreeDay !== this.today(); },
  useFree() { this.save.lastFreeDay = this.today(); this.persist(); },

  /* 可玩关卡：已解锁且所属章已开放（未开放章数据先行、入口锁定） */
  _playableLevels() {
    return LEVELS.filter((l, i) => i < this.save.unlocked && CHAPTERS[l.chapter].enabled);
  },
  /* 前沿章：玩家已解锁的最高可玩关所在章（未开放章向下回退到最近开放章） */
  _frontierChapter() {
    let chId = Math.floor((Math.min(this.save.unlocked, LEVELS.length) - 1) / 5);
    while (chId > 0 && !CHAPTERS[chId].enabled) chId--;
    return CHAPTERS[chId];
  },
  _frontierMinEntry() {
    const ch = this._frontierChapter();
    return Math.min(...ch.levels.map(l => l.entry));
  },
  reliefAvailable() {
    return this.save.lastReliefDay !== this.today()
      && this.save.gold < this._frontierMinEntry() && !this.freeLeft();
  },
  /* 动态救济金：三下限取最大——
   * ① 固定下限 60；② 最低可玩关门票（保证领后必能入场，不锁死）；
   * ③ 前沿章最低门票 × 0.6（后期破产也能快速回到本章） */
  reliefAmount() {
    const playable = this._playableLevels();
    const minPlayable = playable.length
      ? Math.min(...playable.map(l => l.entry)) : CONFIG.ECONOMY.RELIEF_GOLD;
    return Math.max(
      CONFIG.ECONOMY.RELIEF_GOLD,
      minPlayable,
      Math.round(this._frontierMinEntry() * CONFIG.ECONOMY.RELIEF_RATIO),
    );
  },

  /* ---------- 屏幕切换 ---------- */
  switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  },

  /* ---------- 大厅 ---------- */
  showHub() {
    this.switchScreen('screen-hub');
    this.renderHub();
  },

  renderHub() {
    document.getElementById('hubGold').textContent = `🪙 ${this.save.gold}`;
    const free = document.getElementById('hubFree');
    free.textContent = this.freeLeft() ? '🎫 今日免费 ×1' : '🎫 今日免费 已用';
    free.classList.toggle('used', !this.freeLeft());
    document.querySelector('.hub-title p').textContent =
      `打中什么，拿什么 · 关卡进度 ${Math.min(this.save.unlocked, LEVELS.length)}/${LEVELS.length}`;

    // 救济金（动态：三下限取最大，见 reliefAmount）
    const rw = document.getElementById('reliefWrap');
    rw.innerHTML = '';
    if (this.reliefAvailable()) {
      const amt = this.reliefAmount();
      const b = document.createElement('button');
      b.className = 'btn btn-gold';
      b.textContent = `🆘 领取救济金 +${amt}🪙`;
      b.onclick = () => {
        this.save.gold += amt;
        this.save.lastReliefDay = this.today();
        this.persist();
        this.toast(`救济金 +${amt}🪙，明天也要来玩哦`);
        this.renderHub();
      };
      rw.appendChild(b);
    }

    // 章节大厅（两级导航：10 张章牌 ⇄ 章内 5 张关卡卡）
    const wrap = document.getElementById('levelCards');
    wrap.innerHTML = '';
    if (this.hubChapter === null) {
      wrap.className = 'chapter-grid';
      CHAPTERS.forEach(ch => wrap.appendChild(this._chapterCard(ch)));
    } else {
      wrap.className = 'level-cards';
      const ch = CHAPTERS[this.hubChapter];
      const head = document.createElement('div');
      head.className = 'chapter-head';
      head.innerHTML = `
        <button class="btn btn-ghost" type="button">← 返回章节</button>
        <div class="ch-title"><span class="ch-icon">${ch.icon}</span><b>第${ch.id + 1}章 · ${ch.name}</b>
          <span class="ch-theme">${ch.theme}</span></div>`;
      head.querySelector('button').onclick = () => { this.hubChapter = null; this.renderHub(); };
      wrap.appendChild(head);
      // 注意用 LEVELS 展开条目（含 chapter/chapterIndex），而非章模板原始对象
      for (let i = 0; i < ch.levels.length; i++) {
        wrap.appendChild(this._levelCard(LEVELS[ch.id * 5 + i], ch.id * 5 + i));
      }
    }
  },

  _chapterCard(ch) {
    const start = ch.id * 5;
    const chUnlocked = this.save.unlocked > start;      // 章内至少第 1 关已解锁
    const playable = ch.enabled && chUnlocked;
    const progress = clamp(this.save.unlocked - start, 0, 5);
    const card = document.createElement('div');
    card.className = 'chapter-card' + (playable ? '' : (ch.enabled ? ' locked' : ' disabled'));

    let status, statusCls = 'ch-status';
    if (!ch.enabled) { status = '🚧 敬请期待'; statusCls += ' soon'; }
    else if (!chUnlocked) { status = `🔒 通过「${LEVELS[start - 1].name}」解锁`; statusCls += ' lock'; }
    else { status = `已解锁 ${progress}/5`; }

    const entries = ch.levels.map(l => l.entry);
    card.innerHTML = `
      <div class="ch-top">
        <span class="ch-icon">${ch.icon}</span>
        <div class="ch-name"><b>第${ch.id + 1}章 · ${ch.name}</b>
          <span class="ch-stars">${'★'.repeat(ch.stars)}${'☆'.repeat(5 - ch.stars)}</span></div>
      </div>
      <div class="ch-theme">${ch.theme}</div>
      <div class="ch-meta">
        <span class="chip">🎫 ${Math.min(...entries)}~${Math.max(...entries)}🪙</span>
        <span class="chip ${statusCls}">${status}</span>
      </div>`;

    card.onclick = () => {
      if (!ch.enabled) { this.toast(`「${ch.name}」将在后续版本开放，敬请期待`); return; }
      if (!chUnlocked) { this.toast(`先通过上一章的验收关「${LEVELS[start - 1].name}」`); return; }
      this.hubChapter = ch.id;
      this.renderHub();
    };
    return card;
  },

  _levelCard(lvl, i) {
    const unlocked = i < this.save.unlocked && CHAPTERS[lvl.chapter].enabled;
    const card = document.createElement('div');
    card.className = 'level-card' + (unlocked ? '' : ' locked');

    // 徽章
    const badge = document.createElement('div');
    badge.className = `lv-badge b${lvl.stars}`;
    badge.innerHTML = `L${i + 1}<span class="stars">${'★'.repeat(lvl.stars)}</span>`;
    card.appendChild(badge);

    // 信息
    const info = document.createElement('div');
    info.className = 'lv-info';
    const chips = Object.entries(lvl.pool)
      .filter(([, n]) => n > 0)
      .map(([r, n]) => `<span class="chip r${r}">${CONFIG.RARITY[r].name}×${n}</span>`)
      .join('');
    const best = this.save.bestHits[i] > 0
      ? `最佳：命中 ${this.save.bestHits[i]}/${lvl.bullets} · 回收率 ${Math.round(this.save.bestAcc[i] * 100)}%`
      : '尚未挑战';
    info.innerHTML = `
      <h3>${lvl.name}</h3>
      <div class="lv-sub">${lvl.sub}</div>
      <div class="lv-meta">${chips}
        <span class="chip">🎫 ${lvl.bullets}发</span>
        <span class="chip">清台 +${lvl.clearBonus}🪙</span>
      </div>
      <div class="lv-best">${best}</div>`;
    card.appendChild(info);

    // 操作区
    const act = document.createElement('div');
    act.className = 'lv-action';
    if (!unlocked) {
      const tip = !CHAPTERS[lvl.chapter].enabled
        ? '该章节即将开放'
        : `「${LEVELS[i - 1].name}」命中 ≥${LEVELS[i - 1].unlockNextHits} 后解锁`;
      act.innerHTML = `<div class="lv-entry">🔒</div>
        <div class="lock-tip">${tip}</div>`;
    } else if (this.freeLeft()) {
      const b = document.createElement('button');
      b.className = 'btn btn-gold';
      b.textContent = '免费入场（今日1次）';
      b.onclick = () => this.startLevel(i, true);
      act.appendChild(b);
      act.insertAdjacentHTML('beforeend', `<div class="lv-entry">原价 ${lvl.entry}🪙</div>`);
    } else {
      const b = document.createElement('button');
      b.className = 'btn btn-gold';
      b.textContent = `入场 -${lvl.entry}🪙`;
      b.disabled = this.save.gold < lvl.entry;
      b.onclick = () => this.startLevel(i, false);
      act.appendChild(b);
      const own = document.createElement('div');
      own.className = 'lv-entry';
      own.textContent = `已有 ${this.save.gold}🪙`;
      act.appendChild(own);
    }
    card.appendChild(act);
    return card;
  },

  /* ---------- 开局（M4 经济入口） ---------- */
  startLevel(i, free) {
    const lvl = LEVELS[i];
    // 未开放章（数据先行、机制代码未落地）：入口锁定
    if (!CHAPTERS[lvl.chapter].enabled) {
      this.toast('该章节尚未开放，敬请期待');
      this.showHub();
      return;
    }
    if (free) {
      this.useFree();
    } else {
      if (this.save.gold < lvl.entry) {
        this.toast('金币不足！可等每日免费或领救济金');
        this.showHub();   // 回大厅，避免卡在已停止的射击画面
        return;
      }
      this.save.gold -= lvl.entry;
    }
    this.freeUsedThisRun = free;
    this.currentLevel = i;
    this.persist();

    // 移动端：借入场手势顺势全屏并锁定横屏（不阻塞开局，失败静默）
    if (document.body.classList.contains('touch-ui') && !document.fullscreenElement
        && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen()
        .then(() => screen.orientation && screen.orientation.lock
          ? screen.orientation.lock('landscape').catch(() => {}) : null)
        .catch(() => {});
    }

    this.switchScreen('screen-game');
    this._fitCanvas();
    // 新场景默认未开镜：复位开镜按钮高亮
    document.getElementById('btnScope').classList.remove('on');
    document.getElementById('btnBreath').classList.remove('on');
    document.getElementById('hudHint').textContent =
      (document.body.classList.contains('touch-ui') ? '【滑动瞄准 · 🫁 点按屏息时停 · 🔭 开镜 · 🔫 开火】' : '') + lvl.hint;

    const canvas = document.getElementById('gameCanvas');
    if (this.scene) this.scene.stop();
    this.scene = new ShootingScene(canvas, lvl, {
      updateHUD: (s) => this._updateHUD(s),
      onPrizeHit: () => {},
      onEnd: (res) => this._onRunEnd(res),
    });
    this.scene.start();
  },

  _hudCache: {},
  _updateHUD(s) {
    const c = this._hudCache;
    if (c.bullets !== s.bullets) {
      c.bullets = s.bullets;
      document.getElementById('hudBullets').textContent = `🎫 ×${s.bullets}`;
    }
    if (c.hits !== s.hits) {
      c.hits = s.hits;
      document.getElementById('hudHits').textContent = `🎯 ${s.hits}/${this.scene.level.bullets}`;
    }
    const wKey = `${s.wind.dir}|${s.wind.level}`;
    if (c.wind !== wKey) {
      c.wind = wKey;
      const el = document.getElementById('hudWind');
      if (!s.wind.level) el.textContent = '🍃 无风';
      else {
        const arrow = s.wind.dir > 0 ? '→→' : '←←';
        el.textContent = `🍃 ${arrow} ${s.wind.level}级`;
      }
    }
    const bar = document.getElementById('breathBar');
    bar.style.width = `${Math.round(s.breath * 100)}%`;
    // 调息锁定：耗尽后回满前，条转为红色斜纹（不可屏息）
    if (c.breathLock !== !!s.breathLock) {
      c.breathLock = !!s.breathLock;
      bar.classList.toggle('lock', c.breathLock);
    }
    // 屏息激活态：按钮亮环（点按切换，耗尽自动退出也要熄灭）
    if (c.breathOn !== !!s.breathing) {
      c.breathOn = !!s.breathing;
      document.getElementById('btnBreath').classList.toggle('on', c.breathOn);
    }
  },

  /* ---------- 结算（经济出口 + 解锁 + 最佳纪录） ---------- */
  _onRunEnd(res) {
    const lvl = LEVELS[this.currentLevel];
    const scene = this.scene;
    if (scene) { scene.stop(); this.scene = null; }

    // 奖品入库（M5）：全件可售；dex 记录永久图鉴（卖出不消失）
    for (const cat of res.prizes) {
      this.save.inventory[cat.id] = (this.save.inventory[cat.id] || 0) + 1;
      this.save.dex[cat.id] = true;
    }
    // 清台奖励
    let bonus = 0;
    if (res.cleared) {
      bonus = lvl.clearBonus;
      this.save.gold += bonus;
    }
    // 解锁下一关（存档 v2：unlocked 为关序 int，只前进不回退）
    let unlockedMsg = '';
    const nextIdx = this.currentLevel + 1;
    const next = LEVELS[nextIdx];
    if (next && res.hits >= lvl.unlockNextHits && nextIdx >= this.save.unlocked) {
      this.save.unlocked = nextIdx + 1;
      if (next.chapterIndex === 0) {
        const nch = CHAPTERS[next.chapter];
        unlockedMsg = nch.enabled
          ? `🔓 已解锁新章节：「第${nch.id + 1}章 · ${nch.name}」`
          : `🎓 当前章节全部通关——「${nch.name}」即将开放，敬请期待！`;
      } else {
        unlockedMsg = `🔓 已解锁新关卡：「${next.name}」`;
      }
    }
    // 最佳纪录
    const acc = res.shots > 0 ? res.hits / res.shots : 0;
    if (res.hits > this.save.bestHits[this.currentLevel]) this.save.bestHits[this.currentLevel] = res.hits;
    if (acc > this.save.bestAcc[this.currentLevel]) this.save.bestAcc[this.currentLevel] = acc;
    this.persist();

    const totalValue = res.prizes.reduce((s, p) => s + p.value, 0);
    const spent = this.freeUsedThisRun ? 0 : lvl.entry;
    const net = totalValue + bonus - spent;

    const raritySpan = (r) =>
      `<span class="r-tag chip r${r}">${CONFIG.RARITY[r].name}</span>`;

    const body = `
      <div class="result-grid">
        <div class="result-stat"><b>${res.shots}</b><span>发射</span></div>
        <div class="result-stat"><b>${res.hits}</b><span>命中</span></div>
        <div class="result-stat"><b>${res.shots ? Math.round(acc * 100) : 0}%</b><span>命中率</span></div>
        <div class="result-stat"><b>${res.prizes.length}</b><span>奖品</span></div>
      </div>
      ${res.prizes.length ? `<div class="prize-chips">${res.prizes.map(p =>
        `<span class="prize-chip">${p.emoji} ${p.name} ${raritySpan(p.rarity)} ·${p.value}🪙</span>`).join('')}</div>`
        : '<p>空手而归……下次试试先屏息再开枪？</p>'}
      ${res.cleared ? `<p style="color:#6ee7a0">🎉 清台奖励 +${bonus}🪙！</p>` : ''}
      ${res.early ? '<p style="color:#8b93ad">（中途退场：已赢的奖品保留，门票不退）</p>' : ''}
      ${unlockedMsg ? `<p style="color:#ffd873">${unlockedMsg}</p>` : ''}
      <p class="net ${net >= 0 ? 'pos' : 'neg'}">
        门票 -${spent}🪙 · 奖品可售 ${totalValue}🪙${bonus ? ` · 清台 +${bonus}🪙` : ''}
        → 净收支 ${net >= 0 ? '+' : ''}${net}🪙
      </p>
      <p style="color:#8b93ad;font-size:12px">提示：奖品已永久录入图鉴，可随时在「展馆」出售换金币。</p>`;

    if (res.cleared) SFX.fanfare();

    this._modal({
      title: res.cleared ? '🎉 满载而归！' : (res.hits > 0 ? '战果结算' : '下次一定…'),
      body,
      buttons: [
        { label: '返回大厅', cls: 'btn-ghost', fn: () => this.showHub() },
        {
          label: '再来一局', cls: 'btn-gold',
          fn: () => { this.startLevel(this.currentLevel, this.freeLeft()); },
        },
      ],
    });
  },

  /* ---------- 展馆 / 图鉴（M5） ---------- */
  showGallery() {
    this.switchScreen('screen-gallery');
    this.renderGallery();
  },

  renderGallery() {
    const inv = this.save.inventory;
    const dex = this.save.dex || {};
    const known = (c) => !!dex[c.id] || (inv[c.id] || 0) > 0;
    const collected = CATALOG.filter(known).length;
    // 全件可售：持有数 × 售价（首件也计入——图鉴记录由 dex 永久保留）
    const sellValue = CATALOG.reduce((s, c) => s + (inv[c.id] || 0) * c.value, 0);
    document.getElementById('galleryStats').innerHTML =
      `图鉴 <b>${collected}/${CATALOG.length}</b> · 可售价值 <b>${sellValue}🪙</b>`;

    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';
    for (const r of ['SSR', 'SR', 'R', 'N']) {
      for (const cat of CATALOG.filter(c => c.rarity === r)) {
        grid.appendChild(this._galleryItem(cat, inv[cat.id] || 0, known(cat)));
      }
    }

    const footer = document.getElementById('galleryFooter');
    footer.innerHTML = '';
    if (sellValue > 0) {
      const b = document.createElement('button');
      b.className = 'btn btn-gold';
      b.textContent = `一键出售全部奖品 +${sellValue}🪙`;
      b.onclick = () => {
        for (const c of CATALOG) {
          if (this.save.inventory[c.id] > 0) this.save.inventory[c.id] = 0;
        }
        this.save.gold += sellValue;
        this.persist();
        SFX.sell();
        this.toast(`出售成功 +${sellValue}🪙`);
        this.renderGallery();
      };
      footer.appendChild(b);
    }
  },

  _galleryItem(cat, count, known) {
    const rc = CONFIG.RARITY[cat.rarity];
    const el = document.createElement('div');
    el.className = 'g-item' + (known ? '' : ' unknown');
    const sub = known
      ? ` 售价${cat.value}🪙 · ${count > 0
          ? `<span class="pinned">持有 ×${count}</span>`
          : `<span class="pinned">已售出 · 图鉴永久展出</span>`}`
      : '';
    const inner = `
      <div class="gi-emoji">${known ? cat.emoji : '❔'}</div>
      <div class="gi-name">${known ? cat.name : '？？？'}</div>
      <div class="gi-sub">
        ${`<span class="r-tag" style="color:${rc.color};border:1px solid ${rc.color}55">${rc.name}</span>`}${sub}
      </div>`;
    el.innerHTML = inner;
    if (count > 0) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = `出售 ×${count}（+${count * cat.value}🪙）`;
      b.onclick = () => {
        this.save.inventory[cat.id] = 0;
        this.save.gold += count * cat.value;
        this.persist();
        SFX.sell();
        this.toast(`${cat.name} ×${count} 出售 +${count * cat.value}🪙`);
        this.renderGallery();
      };
      el.appendChild(b);
    }
    return el;
  },

  /* ---------- UI 基础设施（M7） ---------- */
  _modal({ title, body, buttons }) {
    const root = document.getElementById('modal-root');
    root.innerHTML = '';
    root.classList.add('open');
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<h3>${title}</h3><div class="m-body">${body}</div>`;
    const btns = document.createElement('div');
    btns.className = 'm-btns';
    for (const b of buttons) {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || '');
      el.textContent = b.label;
      el.onclick = () => { root.classList.remove('open'); if (b.fn) b.fn(); };
      btns.appendChild(el);
    }
    m.appendChild(btns);
    root.appendChild(m);
  },

  toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 2300);
  },

  /* ---------- 帮助（M10） ---------- */
  showHelp(first) {
    this._modal({
      title: '🎯 夜市神枪手 · 玩法',
      body: `
        <p><b>规则：</b>打中什么，拿什么！奖品全部摆在摊位上，命中即归你。</p>
        <p><b>章节：</b>50 关分 10 章，每章 1 种新玩法；通过每章第 5 关「验收关」解锁下一章。</p>
        <p><b>瞄准：</b>准星会随呼吸漂移，<b>屏息</b>（点按切换）稳住准星并让世界陷入<b>极慢的时停</b>——吊摆/传送带近乎冻结，<b>子弹不受影响照常飞行</b>、命中即时反馈；耐力条耗尽自动退出并需调息 5 秒（红色斜纹=不可用）。</p>
        <p><b>弹道：</b>高难度关卡有<b>风力</b>（顶栏风向标）和<b>下坠</b>——先试射一枪，看弹孔位置校准！</p>
        <p><b>奖品：</b>在展馆查看图鉴，随时可卖成金币——图鉴永久保留展出记录。</p>
        <p><b>金币：</b>每天 1 次免费入场 + 破产有救济金，永远玩得下去。</p>
        <p><b>操作：</b>🖱 鼠标移动瞄准，左键射击，空格点按屏息（时停）。<br>📱 横屏触屏：<b>滑动屏幕任意位置</b>移动准星（相对拖动，无需点住准星）；画布两侧按键：<b>左侧</b> 🫁 屏息（点按时停，再点退出）/ 🔫 开火，<b>右侧</b> 🔭 开镜（狙击镜 2×）/ 🔫 副开火（长按连发）。</p>
        <p><b>📱 横屏游玩最佳</b>；竖屏窗口时画面会旋转铺满提示转向，首次点击自动全屏。</p>`,
      buttons: [{ label: first ? '开始打枪！' : '知道了', cls: 'btn-gold' }],
    });
  },

  /* ---------- 事件绑定 ---------- */
  _bind() {
    // 触屏模式识别：粗指针设备或首次 touch 事件 → body.touch-ui（驱动布局微调）
    if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch-ui');
    window.addEventListener('touchstart', () => {
      document.body.classList.add('touch-ui');
      this.syncOrientation();     // 补注册的触屏设备：补算旋转态
    }, { once: true, passive: true });

    // 方向/尺寸变化：重算旋转态、等效视口与画布尺寸
    window.addEventListener('resize', () => { this.syncOrientation(); this._fitCanvas(); });
    window.addEventListener('orientationchange', () => { this.syncOrientation(); this._fitCanvas(); });
    if (window.ResizeObserver) {
      new ResizeObserver(() => this._fitCanvas()).observe(document.querySelector('.game-wrap'));
    }

    // 触屏首次点击：顺势全屏并尝试锁定横屏（浏览器不允许无手势强制系统方向，
    // 这是"打开即横屏全屏"的最接近实现；iOS 无锁屏 API，靠旋转显示兜底）
    window.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'touch') return;
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen()
          .then(() => screen.orientation && screen.orientation.lock
            ? screen.orientation.lock('landscape').catch(() => {}) : null)
          .catch(() => {});
      }
    }, { once: true });

    // 多标签存档同步：file:// 下所有标签共享同一 localStorage。任一标签写入后，
    // 其他标签热重载内存存档——防止旧内存态覆盖新进度（"赢的钱被回滚"）。
    // 局中不重绘（场景状态独立于存档，结算只做增量写入）；大厅/展馆刷新显示。
    window.addEventListener('storage', (e) => {
      if (e.key !== SAVE_KEY) return;
      let fresh = null;
      try { if (e.newValue) fresh = JSON.parse(e.newValue); } catch (err) { fresh = null; }
      this.save = fresh ? normalizeSave(fresh) : defaultSave();
      SFX.setMuted(this.save.muted);
      const active = document.querySelector('.screen.active');
      if (active && active.id === 'screen-hub') this.renderHub();
      else if (active && active.id === 'screen-gallery') this.renderGallery();
    });

    document.getElementById('btnGallery').onclick = () => this.showGallery();
    document.getElementById('btnGalleryBack').onclick = () => this.showHub();
    document.getElementById('btnHelp').onclick = () => this.showHelp(false);

    // 全屏 + 横屏锁定（Android 支持锁定；iOS 无锁屏 API，靠旋转显示）
    document.getElementById('btnFullscreen').onclick = async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          this.toast('已进入全屏沉浸模式');
        } else {
          await document.exitFullscreen();
        }
      } catch (e) { this.toast('当前浏览器不支持全屏'); return; }
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) { /* iOS 等不支持锁屏的环境静默忽略 */ }
    };

    document.getElementById('btnMute').onclick = (e) => {
      this.save.muted = !this.save.muted;
      SFX.setMuted(this.save.muted);
      this.persist();
      e.target.textContent = this.save.muted ? '🔇' : '🔊';
    };
    if (this.save.muted) document.getElementById('btnMute').textContent = '🔇';
    document.getElementById('btnReset').onclick = () => {
      this._modal({
        title: '重置存档？',
        body: `<p>金币、图鉴、50 关章节进度全部清空，重新从 ${CONFIG.ECONOMY.START_GOLD}🪙 开始。</p>`,
        buttons: [
          { label: '取消', cls: 'btn-ghost' },
          {
            label: '确认重置', cls: 'btn-danger',
            fn: () => { this.save = defaultSave(); this.persist(); this.showHub(); },
          },
        ],
      });
    };
    // 射击页按钮
    document.getElementById('btnExit').onclick = () => {
      this._modal({
        title: '提前退场？',
        body: '<p>已打中的奖品会保留，但门票不退哦。</p>',
        buttons: [
          { label: '继续打', cls: 'btn-gold' },
          { label: '退场', cls: 'btn-ghost', fn: () => { if (this.scene) this.scene.endEarly(); } },
        ],
      });
    };
    const breathBtn = document.getElementById('btnBreath');
    // 屏息 = 点按切换的时停模式（再点提前退出；耗尽自动退出+调息锁 5s）
    breathBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (this.scene) this.scene.toggleBreath();
    });

    // 触屏开火按钮（主/副同款）：点按开火，长按连发（射击间隔由冷却节流）
    const bindFireButton = (btn) => {
      let fireTimer = 0;
      const stopFire = () => clearInterval(fireTimer);
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        SFX.unlock();
        if (this.scene) this.scene.shoot();
        fireTimer = setInterval(() => { if (this.scene) this.scene.shoot(); }, 280);
      });
      btn.addEventListener('pointerup', stopFire);
      btn.addEventListener('pointerleave', stopFire);
      btn.addEventListener('pointercancel', stopFire);
    };
    bindFireButton(document.getElementById('btnFire'));    // 左侧主开火
    bindFireButton(document.getElementById('btnFire2'));   // 右侧副开火（同逻辑）

    // 开镜按钮（右侧）：点按切换 2× 放大（拖动灵敏度随之减半，利于精瞄）
    const scopeBtn = document.getElementById('btnScope');
    scopeBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      SFX.unlock();
      if (!this.scene) return;
      const on = this.scene.toggleScope();
      scopeBtn.classList.toggle('on', on);
    });
  },
};

App.init();

</script>
